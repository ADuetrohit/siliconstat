name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      # The ngspice-dependent tests skip themselves when the binary is absent,
      # so install it and get the cross-validation for free. Ubuntu ships 42;
      # development happens against 46, which makes CI a second opinion on the
      # ngspice side too.
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      # The API serves the built dashboard and falls back to index.html for
      # client-side routes. Those tests skip when frontend/dist is absent, so
      # without this build they would quietly contribute nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the dashboard
        run: npm ci && npm run build
        working-directory: frontend

      # -rs lists why anything skipped, so a test that quietly stops running is
      # visible in the log rather than hiding inside the pass count.
      - name: Test
        run: pytest -q -rs --junitxml=junit.xml

      - name: Summarise
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, os, pathlib
          if not pathlib.Path("junit.xml").is_file():
              raise SystemExit("no junit.xml -- pytest did not get far enough")
          a = ET.parse("junit.xml").getroot().find("testsuite").attrib
          passed = int(a["tests"]) - int(a["failures"]) - int(a["errors"]) - int(a["skipped"])
          line = (f"{passed} passed, {a['skipped']} skipped, {a['failures']} failed, "
                  f"{a['errors']} errored in {float(a['time']):.1f}s")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### Python ${{ matrix.python }}\n\n{line}\n")
          PY

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
